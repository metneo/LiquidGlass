version: 2
updates:
  # Keep the GitHub Actions used across all workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Track the dev command plugins (swift-docc-plugin, SwiftLintPlugins) hosted
  # by the CI builder package.
  - package-ecosystem: swift
    directory: /.github/build-tools
    schedule:
      interval: weekly
    groups:
      swift:
        patterns: ['*']