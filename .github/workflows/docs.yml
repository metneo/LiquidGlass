name: Docs

# Build the in-repo Documentation.docc catalog and publish it to GitHub Pages.
# Requires Swift DocC → "Settings → Pages → Build and deployment → GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write           # required to publish a Pages artifact
  id-token: write        # required by actions/deploy-pages

jobs:
  build:
    # xcode-27 = macOS 27 + Xcode 27 (there is no macos-27 label).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build DocC archive
        run: |
          # Project Pages URL is https://<user>.github.io/LiquidGlass/...
          # so hosting-base-path must be the repo name. Drop it for a custom
          # domain or a unique-subdomain Pages site that publishes at `/`.
          swift package --allow-writing-to-directory docs \
            generate-documentation \
            --target LiquidGlass \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path LiquidGlass \
            --output-path docs

      # DocC's root index.html is intentionally blank; content lives under
      # /documentation/<target-lowercase>. Redirect so the Pages URL works.
      - name: Redirect Pages root to DocC entry
        run: |
          cat > docs/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=documentation/liquidglass">
            <link rel="canonical" href="https://metneo.github.io/LiquidGlass/documentation/liquidglass">
            <title>Redirecting…</title>
            <script>window.location.replace("documentation/liquidglass");</script>
          </head>
          <body>
            <p>Redirecting to <a href="documentation/liquidglass">LiquidGlass documentation</a>…</p>
          </body>
          </html>
          EOF

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
