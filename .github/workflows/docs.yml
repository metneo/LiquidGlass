name: Docs

# Build the in-repo Documentation.docc catalog on every push to main and only
# publish it to GitHub Pages when a release tag is pushed. Requires Swift DocC →
# "Settings → Pages → Build and deployment → GitHub Actions".
on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

# Cancel superseded runs for the same ref. Tag runs are keyed by their own ref,
# so a main-branch push can never cancel an in-flight release build/deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write           # required to publish a Pages artifact
  id-token: write        # required by actions/deploy-pages

jobs:
  build:
    # xcode-27 = macOS 27 + Xcode 27 (there is no macos-27 label).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # swift-docc-plugin lives in `.github/build-tools` — a throwaway builder
      # package — because LiquidGlass itself declares no dependencies. Copy the
      # sources in so the builder is complete, then run the plugin.
      - name: Build DocC archive
        # Project Pages URL is https://<user>.github.io/LiquidGlass/...
        # so hosting-base-path must be the repo name. Drop it for a custom
        # domain or a unique-subdomain Pages site that publishes at `/`.
        run: |
          mkdir -p .github/build-tools/Sources/LiquidGlass
          cp -R Sources/LiquidGlass/. .github/build-tools/Sources/LiquidGlass/
          swift package \
            --package-path .github/build-tools \
            --allow-writing-to-directory "$GITHUB_WORKSPACE/docs" \
            generate-documentation \
            --target LiquidGlass \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path LiquidGlass \
            --output-path "$GITHUB_WORKSPACE/docs"

      # DocC's root index.html is intentionally blank; content lives under
      # /documentation/<target-lowercase>. Redirect so the Pages URL works.
      - name: Redirect Pages root to DocC entry
        run: |
          cat > docs/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=documentation/liquidglass">
            <link rel="canonical" href="https://metneo.github.io/LiquidGlass/documentation/liquidglass">
            <title>Redirecting…</title>
            <script>window.location.replace("documentation/liquidglass");</script>
          </head>
          <body>
            <p>Redirecting to <a href="documentation/liquidglass">LiquidGlass documentation</a>…</p>
          </body>
          </html>
          EOF

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    # Publishing is tag-only: ordinary pushes still build the archive (so DocC
    # breakage fails CI) but leave the live site untouched.
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Serialize deployments across tags; never cancel one mid-publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
