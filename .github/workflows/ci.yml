name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Sources/**/Documentation.docc/**'
      - '.github/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Sources/**/Documentation.docc/**'
      - '.github/**'
      - 'LICENSE'
  workflow_dispatch:

# Cancel redundant in-progress runs (e.g. a newer push to the same PR/branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false          # keep the other toolchain running even if one fails
      # Every supported macOS line: Package.swift declares .macOS(.v12), so the
      # matrix spans macOS 12 through 26 plus the Xcode 27 image. Each runner
      # needs a Swift 6.3+ toolchain (swift-tools-version 6.3).
      matrix:
        include:
          - os: macos-26
          - os: macos-15
          - os: macos-14
          - os: macos-13
          - os: macos-12
          - os: xcode-27
    steps:
    - uses: actions/checkout@v7

    - name: Confirm Swift toolchain
      run: |
        xcodebuild -version
        swift --version

    # The package declares no external dependencies, so there is no SwiftPM
    # dependency cache to save/restore — the removed cache step was pure overhead.
    - name: Build
      run: swift build

    - name: Run tests
      run: swift test