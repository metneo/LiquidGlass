name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Sources/**/Documentation.docc/**'
      - '.github/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Sources/**/Documentation.docc/**'
      - '.github/**'
      - 'LICENSE'
  workflow_dispatch:

# Cancel redundant in-progress runs (e.g. a newer push to the same PR/branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false          # keep the other toolchain running even if one fails
      matrix:
        include:
          - os: macos-26
          - os: xcode-27
    steps:
    - uses: actions/checkout@v7

    - name: Confirm Swift toolchain
      run: |
        xcodebuild -version
        swift --version

    # The package declares no external dependencies, so there is no SwiftPM
    # dependency cache to save/restore — the removed cache step was pure overhead.
    - name: Build
      run: swift build

    - name: Run tests
      run: swift test

  lint-test:
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # SwiftLint isn't a dependency of LiquidGlass itself; it's a command
      # plugin hosted in `.github/build-tools` (the same builder the Docs
      # workflow uses for DocC). Copy the sources in, then run the plugin.
      # `.swiftlint.yml` is gitignored/local-only, so CI uses default rules.
      - name: Run SwiftLint
        run: |
          mkdir -p .github/build-tools/Sources/LiquidGlass
          cp -R Sources/LiquidGlass/. .github/build-tools/Sources/LiquidGlass/
          swift package \
            --package-path .github/build-tools \
            plugin \
            --allow-writing-to-package-directory \
            swiftlint