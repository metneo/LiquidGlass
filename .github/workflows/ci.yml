name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Sources/**/Documentation.docc/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Sources/**/Documentation.docc/**'
      - 'LICENSE'
  workflow_dispatch:

# Cancel redundant in-progress runs (e.g. a newer push to the same PR/branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Least-privilege: these two jobs only read the repository. The reusable
  # `soundness` workflow keeps the default token because it posts PR comments
  # for license-header findings.
  build:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false          # keep the other Swift version running even if one fails
      matrix:
        version: [ '5.9', '6.2' ]
    steps:
    - uses: actions/checkout@v5
    - name: Set up Swift
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: ${{ matrix.version }}
    - name: Cache SwiftPM build products
      id: cache-swiftpm
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-swift-${{ matrix.version }}-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-swift-${{ matrix.version }}
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v

  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@main
    with:
      license_header_check_project_name: "LiquidGlass"

  lint-test:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Pin SwiftLint to an exact version (via Mint + the Mintfile) so lint is
      # deterministic, and cache ~/.mint so the (slow) fetch/build only happens once.
      - name: Cache Mint packages (SwiftLint)
        id: cache-mint
        uses: actions/cache@v4
        with:
          path: ~/.mint
          key: ${{ runner.os }}-mint-${{ hashFiles('Mintfile') }}

      - name: Install Mint and bootstrap SwiftLint
        if: steps.cache-mint.outputs.cache-hit != 'true'
        run: |
          brew install mint
          mint bootstrap

      - name: Add Mint bin to PATH
        run: echo "$HOME/.mint/bin" >> "$GITHUB_PATH"

      - name: Run SwiftLint
        run: swiftlint lint