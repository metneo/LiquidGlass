name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Sources/**/Documentation.docc/**'
      - '.github/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Sources/**/Documentation.docc/**'
      - '.github/**'
      - 'LICENSE'
  workflow_dispatch:

# Cancel redundant in-progress runs (e.g. a newer push to the same PR/branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false          # keep the other toolchain running even if one fails
      # Only runner images GitHub still hosts. The macOS 12/13 images were
      # retired in 2025 and macOS 14 on 2026-11-02 — an unsupported label now
      # fails with "The configuration 'macos-14-arm64-us-default' is not
      # supported" before a single step runs.
      #
      # What the remaining legs cover:
      #  - macos-15 runs on macOS 15 with an Xcode 26 toolchain, so the package
      #    compiles against the Platform 26 SDK but every `glassEffect` /
      #    `.glass` availability check is false at run time — this is what
      #    exercises the custom-renderer fallback.
      #  - macos-26 and xcode-27 exercise the native Platform 26/27 path.
      #
      # Support for macOS 12–14 is a *deployment target* promise, not a build
      # host: Package.swift declares .macOS(.v12), so the one Xcode 26 build we
      # ship runs there and the compiler rejects any unguarded use of an API
      # newer than 12. The "Verify deployment target" step below checks the
      # emitted objects really carry minos 12.0.
      #
      # Every leg needs a Swift 6.3+ toolchain (swift-tools-version 6.3).
      # macos-26 (Xcode 26.6) and xcode-27 ship one by default; the macos-15
      # image defaults to Xcode 16.4, so it must select a 26.x explicitly.
      matrix:
        include:
          - os: macos-15
            xcode: latest-stable
          - os: macos-26
          - os: xcode-27
    steps:
    - uses: actions/checkout@v7

    # Falsy when the matrix entry has no `xcode` key, i.e. on macos-26 and
    # xcode-27, whose default toolchain is already new enough.
    - name: Select Xcode
      if: matrix.xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.xcode }}

    - name: Confirm Swift toolchain
      run: |
        xcodebuild -version
        swift --version

    # The package declares no external dependencies, so there is no SwiftPM
    # dependency cache to save/restore — the removed cache step was pure overhead.
    - name: Build
      run: swift build

    # Package.swift declares .macOS(.v12); the compiler already rejects any
    # unguarded use of an API newer than macOS 12, so a green build is most of
    # the guarantee that the same artifact runs on Monterey and later. This
    # asserts the emitted object files really carry minos 12.0 instead of
    # silently inheriting the runner's OS version.
    - name: Verify deployment target
      run: |
        object=$(find .build -name '*.o' -path '*LiquidGlass.build*' | head -n 1)
        if [ -z "$object" ]; then
          echo "::error::No LiquidGlass object files found under .build"
          exit 1
        fi
        otool -l "$object" | grep -q 'minos 12\.0' || {
          echo "::error::$object is not built for macOS 12.0"
          otool -l "$object" | grep -A4 LC_BUILD_VERSION
          exit 1
        }

    - name: Run tests
      run: swift test