name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Sources/**/Documentation.docc/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Sources/**/Documentation.docc/**'
      - 'LICENSE'
  workflow_dispatch:

# Cancel redundant in-progress runs (e.g. a newer push to the same PR/branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Least-privilege: these two jobs only read the repository. The reusable
  # `soundness` workflow keeps the default token because it posts PR comments
  # for license-header findings.
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false          # keep the other toolchain running even if one fails
      matrix:
        include:
          - os: macos-26
          - os: xcode-27
    steps:
    - uses: actions/checkout@v7

    - name: Confirm Swift toolchain
      run: |
        xcodebuild -version
        swift --version

    - name: Cache SwiftPM build products
      id: cache-swiftpm
      uses: actions/cache@v6
      with:
        path: .build
        # Package.resolved is gitignored; invalidate on manifest changes.
        key: ${{ matrix.os }}-xcode-${{ matrix.xcode }}-swiftpm-${{ hashFiles('Package.swift', 'Package@swift-*.swift') }}
        restore-keys: |
          ${{ matrix.os }}-xcode-${{ matrix.xcode }}-swiftpm-

    - name: Build
      run: swift build

    - name: Run tests
      run: swift test

  lint-test:
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Version comes from Mintfile; install the portable binary so lint does not
      # depend on brew formula drift or a from-source Mint bootstrap.
      - name: Install SwiftLint
        run: |
          version="$(sed -n 's/^realm\/SwiftLint@//p' Mintfile)"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/realm/SwiftLint/releases/download/${version}/portable_swiftlint.zip" -o /tmp/swiftlint.zip
          unzip -qo /tmp/swiftlint.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run SwiftLint
        run: |
          swiftlint version
          swiftlint lint
